name: ai/triage
description: |
  AI triage for new issues. Reads issue body, suggests labels and priority,
  applies them, posts summary comment. Pure shell.

  Local equivalent: x ai triage

  Requires the provider token as caller-side env (e.g.
  MINIMAX_API_KEY) — composite action steps cannot reference the
  secrets context directly.

inputs:
  apply-labels:
    description: 'Apply suggested labels (true) or just comment (false).'
    required: false
    default: 'true'
  comment:
    description: 'Post the triage summary comment (true) or stay silent (false).'
    required: false
    default: 'true'
  issue-number:
    description: 'Issue to triage. Defaults to the issue that triggered the workflow.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1
      with:
        stream: x7

    - uses: x-cmd-action/this-repo@v1


    - name: run ai triage
      shell: bash
      env:
        INPUT_APPLY_LABELS: ${{ inputs.apply-labels }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUM: ${{ inputs.issue-number || github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: bash "${{ github.action_path }}/triage.sh"