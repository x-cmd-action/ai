name: ai/reply
description: |
  React + reply when a configurable keyword is mentioned in issue/comment.
  Supports static reply or AI-generated reply via x agent request --harness x-chat.
  Strict word-boundary match. Per-target reaction dedupe.
  Concurrency-safe: single in-flight + single pending.

  Local equivalent: x ai reply

inputs:
  keyword:
    description: 'Trigger keyword (default @x). Word-boundary matched.'
    required: false
    default: '@x'
  reaction:
    description: 'Reaction name (eyes, rocket, +1, heart, etc.).'
    required: false
    default: 'eyes'
  comment:
    description: 'Static reply comment body (used when use_ai is false).'
    required: false
    default: '👀 on it'
  use_ai:
    description: 'Generate reply via x agent request instead of using static comment.'
    required: false
    default: 'false'
  harness:
    description: 'AI harness to use when use_ai is true.'
    required: false
    default: 'x-chat'
  provider:
    description: 'AI provider for credential setup (minimax, deepseek, openai). If empty, inferred from API key env vars.'
    required: false
    default: ''
  model:
    description: 'AI model to use. Format is provider-specific, e.g. gpt-4, deepseek-chat.'
    required: false
    default: ''
  prompt:
    description: |
      Inline system prompt. Highest priority — overrides `prompt-file` and the
      built-in default. Useful for one-off custom behavior in a single workflow.
    required: false
    default: ''
  prompt-file:
    description: |
      Path to a markdown file (relative to the action's repo root or the
      workflow's checkout) holding the system prompt. Used when `prompt`
      is empty. Falls back to the built-in `prompt.default.md` if the file
      is not found.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: x-cmd-action/x-cmd@v1
      with:
        stream: x7

    - uses: x-cmd-action/this-repo@v1

    - name: run ai reply
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ISSUE_NUM: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        COMMENT_ID: ${{ github.event.comment.id }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        INPUT_KEYWORD: ${{ inputs.keyword }}
        INPUT_REACTION: ${{ inputs.reaction }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_USE_AI: ${{ inputs.use_ai }}
        INPUT_HARNESS: ${{ inputs.harness }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt-file }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        # Pass the action's own directory so reply.sh can read prompt.default.md
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/reply.sh"