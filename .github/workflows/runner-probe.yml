name: runner-probe

# Probe GitHub-hosted runner images for installed software + sizes.
# Used to decide whether to switch x-cmd-action workflows from
# ubuntu-latest to a smaller/faster/cheaper image (ubuntu-slim, etc.).
#
# Output is captured per-step in the GH Actions UI; the post-step also
# uploads a .json artifact containing the same data.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: "probe (matrix.runner)"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: probe
        shell: bash
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
        run: bash .github/workflows/_probe.sh

      - name: upload artifact
        if: always()
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=(probe-*.json)
          if [ "${#files[@]}" -gt 0 ]; then
            mkdir -p probe-artifact
            cp -v probe-*.json probe-artifact/
          else
            echo "WARN: no probe-*.json produced"
          fi
