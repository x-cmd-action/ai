name: reply

# Live test: when @x is mentioned in an issue/comment, react + reply.
# Supports both static and AI-generated replies (use_ai: true).

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_dispatch:

concurrency:
  group: aireply-bot
  cancel-in-progress: false
  # queue omitted → defaults to 'single' (last pending wins)

jobs:
  reply:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: x-cmd-action/ai/reply@v1
        with:
          keyword: '@x'
          reaction: eyes
          comment: '👀 on it'
          use_ai: 'true'
          provider: minimax
        env:
          MINIMAX_TOKEN: ${{ secrets.MINIMAX_TOKEN }}