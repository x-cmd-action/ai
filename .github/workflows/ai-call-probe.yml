name: ai-call-probe

# Isolate `x agent request` on ubuntu-slim vs ubuntu-latest to find where
# the AI call hangs. Bypasses reply.sh entirely — runs the same commands
# that reply.sh issues, but with strict timeout, full stderr capture, and
# a one-liner prompt so the LLM round-trip is short.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: "ai-call (matrix.runner)"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - uses: x-cmd-action/x-cmd@v1
        with:
          stream: x7

      - uses: x-cmd-action/this-repo@v1

      - name: ai call (isolated)
        shell: bash
        env:
          MINIMAX_TOKEN: ${{ secrets.MINIMAX_TOKEN }}
        run: |
          # No -e anywhere — we want to capture every failure mode.
          set +e
          set +u
          set +o pipefail
          # x-cmd-action installs ~/.x-cmd.root but the next GH Actions
          # step runs under `bash --noprofile --norc`, so ~/.bashrc is
          # never sourced. reply.sh has a defensive PATH+=...
          # ~/.x-cmd.root/bin fallback; mirror that here.
          export PATH="$HOME/.x-cmd.root/bin:$PATH"
          # Source x-cmd boot — its opening lines probe unset vars, so
          # `set -u` must come AFTER sourcing, not before.
          [ -f "$HOME/.x-cmd.root/X" ] && . "$HOME/.x-cmd.root/X" || {
            echo "FATAL: cannot source $HOME/.x-cmd.root/X"
            exit 0
          }
          OUT=/tmp/ai-out.txt
          ERR=/tmp/ai-err.log
          : > "$OUT"
          : > "$ERR"
          export LC_ALL=C

          echo "## runner=${{ matrix.runner }}"
          echo "## uname: $(uname -a)"
          echo "## awk:  $(awk --version 2>&1 | head -1 || echo mawk)"
          echo "## curl: $(curl --version | head -1)"
          echo "## x env: $(command -v x || echo MISSING)"
          echo

          echo "## step 1: configure provider"
          x minimax --cfg apikey="$MINIMAX_TOKEN" >"$OUT" 2>"$ERR"
          PR=$?
          echo "provider step rc=$PR"
          if [ "$PR" = "0" ]; then echo "  out:"; cat "$OUT" | head -10; fi
          if [ -s "$ERR" ]; then echo "  err:"; cat "$ERR" | head -10; fi
          echo

          echo "## step 2: warm-up — short prompt with 30s timeout"
          PROMPT="Reply with the single word 'pong'."
          START=$(date +%s)
          if timeout 30 x agent request \
                --harness x-chat \
                --output "$OUT" \
                --overwrite \
                "$PROMPT" \
                2>>"$ERR" ; then
              DUR=$(($(date +%s) - START))
              echo "short call returned in ${DUR}s, exit 0"
              echo "out: $(cat $OUT | head -c 300)"
          else
              RC=$?
              DUR=$(($(date +%s) - START))
              echo "short call timed out / non-zero after ${DUR}s, rc=$RC"
          fi
          echo
          echo "## step 3: stderr tail"
          tail -50 "$ERR" 2>/dev/null || echo "(empty)"
          echo

          echo "## step 4: long prompt mirroring reply.sh (~5KB, includes CJK detection)"
          # Approximate the prompt size/script that reply.sh feeds to
          # the agent. This is the load that hangs reply.yml's slim run.
          : > "$OUT"
          LONG_PROMPT=$(
              printf '%s\n' "Repository: x-cmd-action/ai"
              printf '%s\n' "Repository description: AI reply (slack-style AI gate) and friends"
              printf '%s\n' ""
              printf '%s\n' "Issue #11: [slim-test-4] reply via . ~/.x-cmd.root/X"
              printf '%s\n' ""
              printf '%s\n' "What is a practical tip for using ubuntu-slim with x-cmd in GitHub Actions?"
              printf '%s\n' "Mention 3 things: (1) how to source x-cmd; (2) what to watch out for with mawk vs gawk in shell scripts; (3) timing expectations."
              printf '%s\n' ""
              printf '%s\n' "You are a terse expert. No preamble. Use markdown bullets. Plain ASCII under 200 words."
          )
          BYTES=$(printf '%s' "$LONG_PROMPT" | wc -c)
          echo "long prompt bytes: $BYTES"
          START=$(date +%s)
          if timeout 60 x agent request \
                --harness x-chat \
                --output "$OUT" \
                --overwrite \
                "$LONG_PROMPT" \
                2>>"$ERR" ; then
              DUR=$(($(date +%s) - START))
              echo "long call returned in ${DUR}s"
              echo "out (first 400 chars): $(cat $OUT | head -c 400)"
          else
              RC=$?
              DUR=$(($(date +%s) - START))
              echo "long call timed out / non-zero after ${DUR}s, rc=$RC"
          fi
          echo
          echo "## step 5: final stderr tail"
          tail -100 "$ERR" 2>/dev/null
          echo

          echo "## step 6: dump /proc status before exit"
          ps -ef | grep -E "x agent|curl|awk|python" | head -20 || true
